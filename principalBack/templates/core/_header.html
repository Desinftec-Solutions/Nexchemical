{% load static %}
<header class="site-header">
    <div class="site-header__inner">
        <a href="{% url 'core:home' %}" class="brand" aria-label="NexChemical home">
            <span class="brand__mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none"><path d="M12 2l3.5 6.5L22 12l-6.5 3.5L12 22l-3.5-6.5L2 12l6.5-3.5L12 2z" fill="currentColor"/></svg>
            </span>
        </a>

        <nav class="main-nav" aria-label="Primary">
            <a href="{% url 'core:home' %}" class="{% if request.resolver_match.view_name == 'core:home' %}is-active{% endif %}">Home</a>
            <a href="{% url 'catalogue:product_list' %}" class="{% if 'catalogue' in request.resolver_match.namespace %}is-active{% endif %}">Catalogue</a>
            <a href="{% url 'core:about' %}" class="{% if request.resolver_match.view_name == 'core:about' %}is-active{% endif %}">About Us</a>
        </nav>

        <div class="nav-actions">
            <button type="button" class="icon-btn" aria-label="Language">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9s1.3-6.4 3.8-9z"/></svg>
            </button>
            <a href="{% url 'contact:contact_page' %}" class="nav-cta">Contact Us</a>
            <button type="button" class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="mobileNav">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>
        </div>
    </div>

    <nav class="mobile-nav" id="mobileNav" aria-label="Mobile">
        <a href="{% url 'core:home' %}">Home</a>
        <a href="{% url 'catalogue:product_list' %}">Catalogue</a>
        <a href="{% url 'core:about' %}">About Us</a>
        <a href="{% url 'contact:contact_page' %}" class="nav-cta">Contact Us</a>
    </nav>
</header>
