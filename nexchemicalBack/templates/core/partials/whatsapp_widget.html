{% load i18n %}
{% if company_info.whatsapp_link %}

      <div class="whatsapp-widget__header">
        <span>{% trans "Chat with us" %}</span>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>

      </div>

      </a>
    </div>
