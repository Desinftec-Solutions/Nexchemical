<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aboutHeroTitle">
  <title id="aboutHeroTitle">Biotechnology and modern agriculture, represented as a DNA helix rising beside a growing leaf over a data network</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="55%" stop-color="#064e78"/>
      <stop offset="100%" stop-color="#054c3d"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <pattern id="dotGrid" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.16"/>
    </pattern>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#dotGrid)"/>
  <circle cx="620" cy="130" r="180" fill="url(#glowBlue)" filter="url(#softBlur)"/>
  <circle cx="130" cy="500" r="170" fill="url(#glowGreen)" filter="url(#softBlur)"/>

  <!-- data / AI network nodes, upper-left -->
  <g stroke="#bfe3ff" stroke-opacity="0.45" stroke-width="1.4">
    <line x1="92" y1="96" x2="168" y2="70"/>
    <line x1="168" y1="70" x2="228" y2="118"/>
    <line x1="92" y1="96" x2="150" y2="150"/>
    <line x1="150" y1="150" x2="228" y2="118"/>
    <line x1="150" y1="150" x2="120" y2="216"/>
  </g>
  <g fill="#e0f2fe">
    <circle cx="92" cy="96" r="5"/>
    <circle cx="168" cy="70" r="4"/>
    <circle cx="228" cy="118" r="5.5"/>
    <circle cx="150" cy="150" r="4"/>
    <circle cx="120" cy="216" r="4.5"/>
  </g>

  <!-- DNA helix, right side: genomic research motif -->
  <g fill="none" stroke-linecap="round">
    <path d="M598,556 C640,520 556,480 598,444 C640,408 556,368 598,332 C640,296 556,256 598,220 C640,184 556,144 598,108 C630,80 606,58 586,46"
          stroke="#7dd3fc" stroke-width="3" stroke-opacity="0.85"/>
    <path d="M638,556 C596,520 680,480 638,444 C596,408 680,368 638,332 C596,296 680,256 638,220 C596,184 680,144 638,108 C606,80 630,58 650,46"
          stroke="#34d399" stroke-width="3" stroke-opacity="0.85"/>
    <g stroke="#e0f2fe" stroke-width="1.6" stroke-opacity="0.55">
      <line x1="598" y1="556" x2="638" y2="556"/>
      <line x1="598" y1="444" x2="638" y2="444"/>
      <line x1="598" y1="332" x2="638" y2="332"/>
      <line x1="598" y1="220" x2="638" y2="220"/>
      <line x1="598" y1="108" x2="638" y2="108"/>
    </g>
  </g>
  <g fill="#f0f9ff">
    <circle cx="598" cy="556" r="4.5"/>
    <circle cx="638" cy="556" r="4.5"/>
    <circle cx="598" cy="444" r="4.5"/>
    <circle cx="638" cy="444" r="4.5"/>
    <circle cx="598" cy="332" r="4.5"/>
    <circle cx="638" cy="332" r="4.5"/>
    <circle cx="598" cy="220" r="4.5"/>
    <circle cx="638" cy="220" r="4.5"/>
    <circle cx="598" cy="108" r="4.5"/>
    <circle cx="638" cy="108" r="4.5"/>
  </g>

  <!-- growing leaf / crop motif, lower-left: agriculture -->
  <path d="M150,600 C96,486 118,388 224,304 C300,392 306,486 262,600 Z" fill="url(#leafGrad)" fill-opacity="0.92"/>
  <path d="M224,304 L216,584" stroke="#ecfdf5" stroke-opacity="0.5" stroke-width="2.4" fill="none"/>
  <path d="M216,420 L176,462 M216,470 L266,516 M216,520 L184,556" stroke="#ecfdf5" stroke-opacity="0.35" stroke-width="1.6" fill="none"/>
  <path d="M382,600 C346,510 358,432 420,368 C470,432 476,510 448,600 Z" fill="url(#leafGrad)" fill-opacity="0.55"/>

  <!-- thin scan ring tying the composition together -->
  <circle cx="420" cy="330" r="230" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <rect width="800" height="600" fill="url(#vignette)"/>
</svg>
